<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrative Entrance | Med Doorshipp</title>
  <link rel="stylesheet" href="/css/luxury.css">
</head>
<body>
  <!-- HEADER -->
  <main class="login-page">
    <div class="login-box">
      <h1>Administrative Entrance</h1>
      <p>Authorized personnel only.</p>
      <form class="checkout-form" action="/admin-login" method="POST">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" required>
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit" class="btn-primary">Authenticate</button>
      </form>
      <a class="back-link" href="/">Return to site</a>
    </div>
  </main>
  <!-- FOOTER -->
</body>
</html>
