<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- PRODUCT_TITLE --> | Med Doorshipp</title>
  <link rel="stylesheet" href="/css/luxury.css">
</head>
<body>
  <!-- HEADER -->

  <article class="product-detail-page">
    <div class="container-shell">
      <p class="breadcrumb"><a href="/collections">Medicine Catalog</a> / <!-- PRODUCT_CATEGORY --> / <!-- PRODUCT_TITLE --></p>
      <div class="product-detail-grid">
        <div class="product-detail-image"><!-- PRODUCT_IMAGE --></div>
        <div class="product-detail-info">
          <h1><!-- PRODUCT_TITLE --></h1>
          <p class="product-detail-price" id="dynamic-product-price"><!-- PRODUCT_PRICE --></p>
          <p class="product-detail-stock"><!-- STOCK_BADGE --></p>
          <div class="product-detail-meta"><strong>Dosage:</strong> <!-- PRODUCT_DOSAGE --></div>
          <div class="product-detail-description"><p><!-- PRODUCT_DESCRIPTION --></p></div>
          <!-- PRECAUTIONS_BLOCK -->
          <div
            id="pack-pricing-root"
            class="pack-pricing-panel"
            data-product-id="<!-- PRODUCT_ID -->"
            data-original="<!-- ORIGINAL_PRICE_VALUE -->"
            data-discount="<!-- DISCOUNT_PRICE_VALUE -->"
          >
            <!-- PACK_SELECT -->
            <p id="pack-deal-hint" class="pack-deal-hint" hidden></p>
          </div>
          <div class="product-detail-actions">
            <form action="/cart/add" method="POST" class="inline-form">
              <input type="hidden" name="product_id" value="<!-- PRODUCT_ID -->">
              <input type="hidden" name="quantity" value="1">
              <input type="hidden" name="redirect" value="/cart">
              <input type="hidden" name="pack_size" id="pack_size_hidden" value="180">
              <button type="submit" class="btn-primary" data-processing-label="Adding…" <!-- OUT_OF_STOCK_DISABLED -->>Add to Cart</button>
            </form>
            <a href="/checkout?product_id=<!-- PRODUCT_ID -->&amp;pack_size=180" class="btn-secondary" id="buy-now-link">Buy Now</a>
            <a href="/collections" class="btn-secondary">Back to Catalog</a>
          </div>
        </div>
      </div>
    </div>
  </article>

  <!-- FOOTER -->
  <script src="/js/pack-pricing.js"></script>
  <script>
    (function () {
      var select = document.getElementById('pack_size');
      var hidden = document.getElementById('pack_size_hidden');
      if (!select || !hidden) return;
      function syncHidden() { hidden.value = select.value; }
      select.addEventListener('change', syncHidden);
      syncHidden();
    })();
  </script>
</body>
</html>
